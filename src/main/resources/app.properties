# Application Configuration for Smart Queue System

# Default average service duration in minutes if no history is available
app.default_avg_minutes=5

# Live Display Board refresh interval in seconds
app.display_refresh_seconds=2

# Queue Scheduler auto-call interval in seconds
app.queue_scheduler_interval_seconds=3

# No-show timeout in seconds (after which a CALLED token becomes SKIPPED)
app.no_show_timeout_seconds=120

# Waiting time in minutes after which a NORMAL token is upgraded to SENIOR rank to prevent starvation
app.starvation_threshold_minutes=30

# Maximum sample history window of completed tokens for wait estimation
app.wait_estimation_history_limit=20
