# Database Configuration for Smart Queue System
# Default: Local MySQL Server

db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3307/smart_queue_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&serverTimezone=UTC&createDatabaseIfNotExist=true
db.user=root
db.password=root

# HikariCP Connection Pool Settings
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.idleTimeout=30000
db.pool.connectionTimeout=10000
db.pool.maxLifetime=1800000

# Offline / Demo Mode:
# When true, if MySQL is unreachable or credentials fail, the application
# automatically initializes an in-memory database with the exact same schema and seed data.
# This prevents crashes during evaluator reviews or when MySQL is offline.
db.offline.fallback.enabled=false
